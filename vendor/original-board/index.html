<title>Personal Board of Directors</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
/* Layout: fixed navigation rail + single reading column; cards only for discrete objects (projects, tiles, the report). */
:root{
  color-scheme:dark;
  --bg:#07131B; --surface:#10232C; --surface-2:#16303B; --line:rgba(148,163,184,.16); --line-strong:rgba(148,163,184,.32);

  --font:'Manrope','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px; --r-sm:9px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}

a{color:var(--accent)}

.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;align-self:start;height:100vh;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}

.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.nav a{display:block;padding:8px 10px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}

  .brand{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

}

@media(max-width:720px){.scorerow{grid-template-columns:minmax(0,1fr)}}

.pill.good{color:var(--good);border-color:rgba(61,214,140,.4)} .pill.warn{color:var(--warn);border-color:rgba(245,185,74,.4)} .pill.bad{color:var(--bad);border-color:rgba(242,112,122,.4)} .pill.acc{color:var(--accent);border-color:rgba(4,206,212,.4)}
.proj{display:flex;flex-direction:column;gap:12px}
.proj .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}

.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.bar{height:6px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.tl{display:flex;flex-direction:column}
.tl .it{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
@media(max-width:640px){.tl .it{grid-template-columns:minmax(0,1fr)}}
.tl .it p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart svg{width:100%;max-width:460px;height:auto;display:block}

.why{display:grid;grid-template-columns:64px minmax(0,1fr) 150px;gap:10px;align-items:start}
@media(max-width:640px){.why{grid-template-columns:minmax(0,1fr)}}
.why .lab{font-weight:800;color:var(--accent);font-size:13px;padding-top:10px}
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,4vw,40px);overflow-wrap:anywhere}
.report h1{font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.report h1+h1{font-size:24px;letter-spacing:-.01em;color:var(--fg);font-weight:800;margin-top:4px}
.report h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:26px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
.report h3{margin:12px 0 4px;font-size:14px}
.report p{margin:6px 0;max-width:72ch}
.report ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;max-width:76ch}

.report .tagm{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border:1px solid rgba(245,185,74,.45);color:var(--warn);border-radius:5px;padding:1px 6px;margin-right:6px}
.steps{counter-reset:s;display:flex;flex-wrap:wrap;gap:8px 18px;padding:0;margin:0;list-style:none;font-size:13px;color:var(--muted)}
.steps li{counter-increment:s}.steps li::before{content:counter(s);color:var(--accent);font-weight:800;margin-right:6px}
dialog{background:var(--surface);color:var(--fg);border:1px solid var(--line-strong);border-radius:var(--r);padding:22px;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(3,10,14,.72)}
dialog .stack{gap:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:10px 16px;font-weight:600;font-size:14px;max-width:calc(100vw - 32px);z-index:50}
#toast.err{border-color:var(--bad)}
.thumb{max-height:54px;border-radius:6px;border:1px solid var(--line)}
@media(prefers-reduced-motion:no-preference){.btn,.nav a,input,textarea,select{transition:border-color .12s,background .12s,color .12s}}
</style>

<script>
"use strict";
/* ================= Services (swap points for auth, cloud sync, AI APIs) =================
   Storage is behind an async adapter: replace Services.storage with a cloud adapter exposing the same load/save.
   Services.auth and Services.ai are intentionally empty; nothing in the app sends data anywhere. */
const KEY='pbd.v1';
const blankState=()=>({version:1,projects:[],reviews:[],reports:[],rcas:[],drafts:{}});
const LocalAdapter={
  async load(){const raw=localStorage.getItem(KEY);return raw?JSON.parse(raw):null},
  async save(state){localStorage.setItem(KEY,JSON.stringify(state))},
  async clear(){localStorage.removeItem(KEY)}
};
const Services={storage:LocalAdapter,auth:null,ai:null};
const AI_TARGETS={chatgpt:{name:'ChatGPT',url:'https://chatgpt.com/'},claude:{name:'Claude',url:'https://claude.ai/'}};

const AI_PROMPT=`Act as my independent Board of Directors, executive performance coach, strategic advisor, and critical-thinking partner.

You are analyzing my performance report.

Your job is not to motivate, flatter, or reassure me.
Your job is to identify patterns, diagnose execution problems, challenge assumptions, and help me achieve measurable outcomes.

Apply:
- Ray Dalio's problem diagnosis.
- Theory of Constraints.
- After-Action Review principles.
- Premortem analysis.
- Opportunity-cost analysis.
- Evidence-based decision-making.

Analyze my report and return:

1. EXECUTIVE VERDICT
What actually happened during this period?

2. TOP FIVE WINS
What worked, and what made these results possible?

3. TOP FIVE PERFORMANCE GAPS
Where did I underperform compared with my commitments?

4. ROOT CAUSE ANALYSIS
Identify the most important underlying obstacles. Distinguish facts from hypotheses.

5. HIDDEN PATTERNS
Identify repeated behaviors, decision patterns, or contradictions supported by the evidence.

6. THE NUMBER ONE BOTTLENECK
Which single constraint should I address first, and why?

7. OPPORTUNITY COST
Where am I investing resources with insufficient returns?

8. STOP / START / CONTINUE
Give me direct, specific actions for each category.

9. SEVEN-DAY ACTION PLAN
Create a realistic plan with measurable deliverables, priorities, deadlines, and accountability.

10. THREE UNCOMFORTABLE QUESTIONS
Challenge my assumptions using three difficult but useful questions.

Be direct, analytical, evidence-based, and specific.
Never invent missing data. Clearly explain when there is insufficient evidence to draw a conclusion.
Items marked [Missing] in the report were not recorded; treat them as unknown, not as zero.`;

/* ================= State ================= */
let S=blankState();
const U={route:'dashboard',rep:{preset:'thisWeek',start:'',end:''},report:null,saved:{},tlFilter:'all',storageOk:true};
const R={S:null,U};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const get=p=>p.split('.').reduce((o,k)=>o==null?o:o[k],R);
const set=(p,v)=>{const ks=p.split('.');const last=ks.pop();const o=ks.reduce((o,k)=>(o[k]??=( {} )),R);o[last]=v};
const fid=p=>'f-'+p.replace(/[^a-zA-Z0-9]/g,'-');
const txt=v=>String(v??'').trim();

/* dates */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const monday=s=>addDays(s,-((parse(s).getDay()+6)%7));
const monthEnd=ym=>{const d=parse(ym+'-01');return iso(new Date(d.getFullYear(),d.getMonth()+1,0))};
const fmt=s=>s?parse(s).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'';
const fmtS=s=>parse(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtDT=t=>new Date(t).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});
function periodOf(type,date){
  if(type==='daily')return[date,date];
  if(type==='weekly'){const m=monday(date);return[m,addDays(m,6)]}
  const ym=date.slice(0,7);return[ym+'-01',monthEnd(ym)];
}
function periodLabel(r){
  if(r.type==='daily')return parse(r.periodStart).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  if(r.type==='weekly')return`Week of ${fmtS(r.periodStart)} – ${fmt(r.periodEnd)}`;
  return parse(r.periodStart).toLocaleDateString(undefined,{month:'long',year:'numeric'});
}

/* persistence */
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(flush,350)}
async function flush(){
  clearTimeout(saveT);
  const el=$('#savestate');
  try{await Services.storage.save(S);U.storageOk=true;el.className='savestate';el.textContent='Saved on this device · '+new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}
  catch(e){U.storageOk=false;el.className='savestate err';el.textContent='Not saved: browser storage is full or blocked. Export a backup from Data & privacy.'}
}
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className=kind||'';t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3600)}

/* ================= Domain helpers ================= */
const SCORES=[['execution','Execution'],['focus','Focus'],['learning','Learning'],['results','Measurable results'],['energy','Sustainable energy']];
const CATS=['Internal','External','Strategic','Technical','Resource'];
const PRIOS=['High','Medium','Low'];
const STATUSES=['Not started','On track','At risk','Blocked','Paused','Done'];
const stClass={'On track':'good','Done':'good','At risk':'warn','Blocked':'bad','Paused':'','Not started':''};
const byType=t=>S.reviews.filter(r=>r.type===t).sort((a,b)=>a.periodStart.localeCompare(b.periodStart));
const inRange=(s,e)=>S.reviews.filter(r=>r.periodEnd>=s&&r.periodStart<=e).sort((a,b)=>a.periodStart.localeCompare(b.periodStart)||a.type.localeCompare(b.type));
function avgScore(r){const v=SCORES.map(([k])=>r.a.scores?.[k]).filter(x=>x>=1);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function stats(rs){
  const o={dDone:0,dTotal:0,wDel:0,wPart:0,wMiss:0,wRated:0,wUnrated:0};
  rs.forEach(r=>{
    if(r.type==='daily')(r.a.priorities||[]).forEach(p=>{if(txt(p.t)){o.dTotal++;if(p.done)o.dDone++}});
    if(r.type==='weekly')(r.a.commitments||[]).forEach(c=>{if(!txt(c.t))return;if(c.status==='delivered'){o.wDel++;o.wRated++}else if(c.status==='partial'){o.wPart++;o.wRated++}else if(c.status==='missed'){o.wMiss++;o.wRated++}else o.wUnrated++});
  });
  o.wRate=o.wRated?o.wDel/o.wRated:null;o.dRate=o.dTotal?o.dDone/o.dTotal:null;return o;
}
const pct=x=>x==null?'—':Math.round(x*100)+'%';
const STOP=new Set('the a an to of and for in on my i with at is it that this was be by not did do too have had from but or as me am are were been get got'.split(' '));
const toks=s=>new Set(String(s).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)));
function sim(a,b){if(!a.size||!b.size)return 0;let n=0;a.forEach(x=>{if(b.has(x))n++});return n/(a.size+b.size-n)}
function cluster(items){ // items: {t,...}; groups entries whose wording overlaps
  const cs=[];
  items.forEach(it=>{const tk=toks(it.t);const c=cs.find(c=>sim(c.tk,tk)>=.5||c.t.toLowerCase()===it.t.toLowerCase());if(c)c.items.push(it);else cs.push({t:it.t,tk,items:[it]})});
  return cs.sort((a,b)=>b.items.length-a.items.length);
}
function obstacles(rs){
  const out=[];
  rs.forEach(r=>{
    if(r.type==='weekly')(r.a.obstacles||[]).forEach(o=>{if(txt(o.t))out.push({t:txt(o.t),root:txt(o.root),cat:o.cat||'',recur:o.recur||'',r})});
    if(r.type==='daily'&&txt(r.a.blocker))out.push({t:txt(r.a.blocker),root:'',cat:r.a.blockerCat||'',recur:'',r});
  });
  return out;
}
function missed(rs){
  const out=[];
  rs.forEach(r=>{
    if(r.type==='daily')(r.a.priorities||[]).forEach(p=>{if(txt(p.t)&&!p.done)out.push({t:txt(p.t),kind:'Daily priority not completed',r})});
    if(r.type==='weekly')(r.a.commitments||[]).forEach(c=>{if(txt(c.t)&&(c.status==='missed'||c.status==='partial'))out.push({t:txt(c.t),kind:c.status==='partial'?'Partially delivered':'Not delivered',r})});
  });
  return out;
}
function insight(){
  const p=S.rcas.find(r=>r.primary&&r.status!=='resolved'&&txt(r.problem));
  if(p){const w=[...p.whys].reverse().find(w=>txt(w.t));return{text:p.problem,detail:w?`Deepest cause recorded (${w.kind==='fact'?'verified fact':'hypothesis'}): ${w.t}`:'',next:p.intervention,src:'You marked this root cause analysis as the primary constraint'}}
  const obs=obstacles(S.reviews);const cl=cluster(obs).find(c=>c.items.length>=2);
  if(cl)return{text:cl.t,detail:`Recorded ${cl.items.length} times across your reviews.`,src:'Most frequently recorded obstacle'};
  const w=byType('weekly').reverse().find(r=>(r.a.obstacles||[]).some(o=>txt(o.t)));
  if(w){const o=w.a.obstacles.find(o=>txt(o.t));return{text:o.t,detail:txt(o.root)?'Root cause recorded: '+o.root:'',src:'Weekly review, '+periodLabel(w)}}
  const d=byType('daily').reverse().find(r=>txt(r.a.blocker));
  if(d)return{text:d.a.blocker,detail:'',src:'Daily review, '+periodLabel(d)};
  const pr=activeProjects().find(p=>txt(p.bottleneck));
  if(pr)return{text:pr.bottleneck,detail:'',src:'Main bottleneck of project “'+pr.name+'”'};
  return null;
}

const activeProjects=()=>S.projects.filter(p=>p.status!=='Done').sort((a,b)=>prioRank(a)-prioRank(b)||String(a.deadline||'9').localeCompare(String(b.deadline||'9')));

function lineChart(pts,{min=0,max,suffix='',label}){
  const W=340,H=124,l=40,r=44,t=14,b=24,x=i=>l+(pts.length<2?0:(W-l-r)*i/(pts.length-1)),y=v=>t+(H-t-b)*(1-(v-min)/(max-min));
  const fmtV=v=>(Math.round(v*10)/10)+suffix;const last=pts[pts.length-1];
  return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}: ${pts.map(p=>p.l+' '+fmtV(p.v)).join(', ')}">
  ${[min,(min+max)/2,max].map(g=>`<line x1="${l}" x2="${W-r}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/><text x="${l-6}" y="${y(g)+3}" text-anchor="end">${fmtV(g)}</text>`).join('')}
  <polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map((p,i)=>x(i)+','+y(p.v)).join(' ')}"/>
  ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?4:2.5}" fill="var(--accent)"><title>${esc(p.l)}: ${fmtV(p.v)}</title></circle>`).join('')}
  <text class="end" x="${x(pts.length-1)+8}" y="${y(last.v)+4}">${fmtV(last.v)}</text>
  <text x="${l}" y="${H-6}">${esc(pts[0].l)}</text>${pts.length>1?`<text x="${W-r}" y="${H-6}" text-anchor="end">${esc(last.l)}</text>`:''}
  </svg></div>`;
}

  rsec('07','Next week’s strategy',inp('One primary outcome',P+'.outcome',{ph:'The single result that makes the week a success'})+

function vRca(){
  const list=[...S.rcas].sort((a,b)=>b.updatedAt-a.updatedAt);
  return`<div class="head"><div><h1>Root cause analysis</h1><p class="muted">Five Whys. Keep asking why until you reach a cause you can act on. Mark each answer as a verified fact or a hypothesis.</p></div><button class="btn primary" data-act="newRca">New analysis</button></div>
  ${list.length?list.map(r=>{const i=S.rcas.indexOf(r),P=`S.rcas.${i}`;const shown=Math.min(5,r.whys.findIndex(w=>!txt(w.t))===-1?5:r.whys.findIndex(w=>!txt(w.t))+1);const hyp=r.whys.filter(w=>txt(w.t)&&w.kind!=='fact').length;
    return`<article class="card stack"><div class="row" style="justify-content:space-between"><span class="row">${r.primary?pill('Primary constraint','acc'):''}${pill(r.status==='resolved'?'Resolved':'Open',r.status==='resolved'?'good':'warn')}${hyp?pill(hyp+' unverified','') :''}</span><span class="small muted">Updated ${fmtDT(r.updatedAt)}</span></div>
    ${ta('Problem',P+'.problem',{rows:2,ph:'I did not launch my product.'})}
    ${r.whys.slice(0,shown).map((w,k)=>`<div class="why"><span class="lab">Why ${k+1}</span>${ta('Why '+(k+1),`${P}.whys.${k}.t`,{rows:2,ph:k===0?'Because…':'Why did that happen?'}).replace('<label','<label hidden')}${sel('Why '+(k+1)+' is a',`${P}.whys.${k}.kind`,[['hypothesis','Hypothesis'],['fact','Verified fact']],{bare:1,rr:1})}</div>`).join('')}
    ${shown<5?`<p class="hint">Answer Why ${shown} to reveal the next question. You can stop early once the cause is actionable.</p>`:''}
    ${ta('Proposed intervention',P+'.intervention',{rows:2,ph:'Validate the minimum offer with real customers before expanding features.'})}
    <div class="row end"><button class="btn sm" data-act="rcaPrimary" data-id="${r.id}">${r.primary?'Unmark primary':'Mark as primary constraint'}</button><button class="btn sm" data-act="rcaStatus" data-id="${r.id}">${r.status==='resolved'?'Reopen':'Mark resolved'}</button><button class="btn sm ghost danger" data-act="delRca" data-id="${r.id}">Delete</button></div></article>`}).join('')

}

function vHistory(){
  const W=byType('weekly'),all=[...S.reviews].sort((a,b)=>b.periodStart.localeCompare(a.periodStart)||b.createdAt-a.createdAt);
  if(!all.length)return`<div class="head"><div><h1>Performance history</h1><p class="muted">Trends, comparisons, and recurring patterns from your saved reviews.</p></div></div>${empty('No saved reviews yet.','History is drawn only from reviews you complete. Nothing is estimated.','<a class="btn primary" href="#daily">Start a daily review</a>')}`;
  const st=stats(S.reviews),rateW=W.filter(r=>stats([r]).wRated),scored=W.filter(r=>avgScore(r)!=null);
  const outcomes=W.filter(r=>txt(r.a.prev?.text)&&r.a.prev.result),ach=outcomes.filter(r=>r.a.prev.result==='achieved').length,doneP=S.projects.filter(p=>p.status==='Done').length;
  const tile=(k,v,s)=>`<div class="tile"><span class="k">${k}</span><span class="v">${v}</span><span class="s">${s}</span></div>`;
  const chartCard=(title,rs,f,o)=>`<div class="card"><h3>${title}</h3>${rs.length>=2?lineChart(rs.slice(-12).map(r=>({l:fmtS(r.periodStart),v:f(r)})),{...o,label:title}):`<p class="small muted" style="margin-top:8px">Needs two weekly reviews with this data. You have ${rs.length}.</p>`}</div>`;
  // comparison
  if(!W.find(r=>r.id===U.cmpA))U.cmpA=W[W.length-2]?.id;if(!W.find(r=>r.id===U.cmpB))U.cmpB=W[W.length-1]?.id;
  const A=W.find(r=>r.id===U.cmpA),B=W.find(r=>r.id===U.cmpB),wopts=W.map(r=>[r.id,periodLabel(r)]);
  const cmpRow=(l,fa,num=true)=>{const a=fa(A),b=fa(B);const dl=num&&a!=null&&b!=null?b-a:null;return`<tr><td>${l}</td><td class="num">${a??'—'}</td><td class="num">${b??'—'}</td><td class="num" style="color:${dl>0?'var(--good)':dl<0?'var(--bad)':'var(--muted)'}">${dl==null?'':(dl>0?'+':'')+Math.round(dl*10)/10}</td></tr>`};
  const rateN=r=>{const s=stats([r]);return s.wRate==null?null:Math.round(s.wRate*100)};
  const obs=obstacles(S.reviews),ocl=cluster(obs).filter(c=>c.items.length>=2),flagged=obs.filter(o=>o.recur==='yes');
  const cats=CATS.map(c=>[c,obs.filter(o=>o.cat===c).length]).filter(x=>x[1]),cmax=Math.max(1,...cats.map(c=>c[1]));

  const resLab={achieved:['Achieved','good'],partial:['Partly','warn'],missed:['Not achieved','bad']};
  const tl=all.filter(r=>U.tlFilter==='all'||r.type===U.tlFilter);
  const snippet=r=>r.type==='daily'?(txt(r.a.win)||(r.a.priorities||[]).map(p=>p.t).filter(txt).join(' · ')):r.type==='weekly'?(txt(r.a.outcome)?'Next outcome: '+r.a.outcome:(r.a.commitments||[]).map(c=>c.t).filter(txt).join(' · ')):(txt(r.a.opportunities)||txt(r.a.quarterly));
  return`<div class="head"><div><h1>Performance history</h1><p class="muted">Every chart and count below comes from your saved reviews.</p></div></div>
  <div class="grid g-tiles">${tile('Reviews saved',all.length,`${byType('daily').length} daily · ${W.length} weekly · ${byType('monthly').length} monthly`)}${tile('Commitment completion',pct(st.wRate),st.wRated?`${st.wDel} of ${st.wRated} weekly commitments`:'No rated commitments')}${tile('Daily priority completion',pct(st.dRate),st.dTotal?`${st.dDone} of ${st.dTotal} priorities`:'No daily priorities')}${tile('Goals achieved',outcomes.length||doneP?ach+doneP:'—',`${ach} of ${outcomes.length} weekly outcomes · ${doneP} projects done`)}</div>
  <section class="section"><h2>Performance trends</h2><div class="grid g-2">${chartCard('Weekly commitment completion',rateW,rateN,{min:0,max:100,suffix:'%'})}${chartCard('Average self-rated score',scored,avgScore,{min:1,max:5})}</div>
  <div class="grid g-3">${SCORES.map(([k,l])=>chartCard(l,W.filter(r=>r.a.scores?.[k]),r=>r.a.scores[k],{min:1,max:5})).join('')}</div></section>
  <section class="section"><h2>Comparison between weeks</h2>${W.length>=2?`<div class="grid g-2">${sel('Week A','U.cmpA',wopts,{rr:1})}${sel('Week B','U.cmpB',wopts,{rr:1})}</div><div class="card scroll"><table><thead><tr><th>Measure</th><th class="num">Week A</th><th class="num">Week B</th><th class="num">Change</th></tr></thead><tbody>
  ${cmpRow('Commitments delivered (%)',rateN)}${SCORES.map(([k,l])=>cmpRow(l+' (1–5)',r=>r.a.scores?.[k]??null)).join('')}${cmpRow('Average score',r=>{const v=avgScore(r);return v==null?null:Math.round(v*10)/10})}${cmpRow('Obstacles recorded',r=>(r.a.obstacles||[]).filter(o=>txt(o.t)).length)}

  <section class="section"><h2>Recurring obstacles</h2><div class="grid g-2"><div class="card stack"><h3>Repeated in your own words</h3>${ocl.length?`<table><tbody>${ocl.map(c=>`<tr><td>${esc(c.t)}<div class="small muted">${c.items.map(i=>fmtS(i.r.periodStart)).join(', ')}</div></td><td class="num">${c.items.length}×</td></tr>`).join('')}</tbody></table>`:'<p class="small muted">No obstacle has been recorded twice with similar wording.</p>'}
  ${flagged.length?`<h3>You said these had happened before</h3><ul style="margin:0;padding-left:18px">${flagged.map(o=>`<li>${esc(o.t)} <span class="small muted">(${fmtS(o.r.periodStart)})</span></li>`).join('')}</ul>`:''}</div>
  <div class="card stack"><h3>Obstacles by type</h3>${cats.length?cats.map(([c,n])=>`<div><div class="row" style="justify-content:space-between"><span class="small">${c}</span><span class="small num">${n}</span></div><div class="bar"><i style="width:${n/cmax*100}%"></i></div></div>`).join(''):'<p class="small muted">No classified obstacles yet.</p>'}</div></div></section>
  <section class="section"><h2>Repeated missed commitments</h2>${mcl.length?`<div class="card scroll"><table><thead><tr><th>Commitment</th><th>When</th><th class="num">Missed</th></tr></thead><tbody>${mcl.map(c=>`<tr><td>${esc(c.t)}</td><td class="small muted">${c.items.map(i=>fmtS(i.r.periodStart)).join(', ')}</td><td class="num">${c.items.length}×</td></tr>`).join('')}</tbody></table></div>`:empty('No commitment has been missed twice.','Repeats show up here when a similar priority or commitment is left undone in more than one review.')}</section>

function calc(k){

  if(!m)return'';

  if(k==='mrate'){const p=numOr(m.planned),c=numOr(m.completed);return p&&c!=null?Math.round(c/p*100)+'%':'—'}

function mdToHtml(md){

  let out='',depth=0;const close=to=>{while(depth>to){out+='</ul>';depth--}};
  md.split('\n').forEach(l=>{
    const m=l.match(/^(\s*)- (.*)$/);
    if(m){const d=m[1].length/2+1;while(depth<d){out+='<ul>';depth++}close(d);out+=`<li${m[2].startsWith('[Missing]')?' class="miss"':''}>${inl(m[2])}</li>`;return}
    close(0);
    if(l.startsWith('# '))out+=`<h1>${inl(l.slice(2))}</h1>`;else if(l.startsWith('## '))out+=`<h2>${inl(l.slice(3))}</h2>`;else if(l.trim())out+=`<p>${inl(l)}</p>`;
  });close(0);return out;
}
function reportPdf(r){

    doc.splitTextToSize(clean(text),W-mx*2-indent).forEach(line=>{if(y>H-60){doc.addPage();y=60}doc.text(line,mx+indent,y);y+=size*1.38});y+=gap};
  r.markdown.split('\n').forEach((l,i)=>{
    const m=l.match(/^(\s*)- (.*)$/);
    if(m){const ind=12+m[1].length*7;if(y>H-60){doc.addPage();y=60}doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(30,41,50);doc.text('-',mx+ind-9,y);put(m[2],{indent:ind,gap:2})}
    else if(l.startsWith('# '))put(l.slice(2),i===0?{size:10,bold:true,color:[100,116,139],gap:2}:{size:20,bold:true,gap:10});

}

    const anyText=JSON.stringify(a).replace(/"(status|kind|cat|recur|currency|blockerCat)":"[^"]*"/g,'').match(/:"[^"]+"|:[1-9]/);
    if(!anyText){toast('This review is empty. Answer at least one question first.','err');return}
    let rev;
    if(dr.id&&(rev=S.reviews.find(r=>r.id===dr.id)))Object.assign(rev,{periodStart:ps,periodEnd:pe,a,updatedAt:now});
    else{rev={id:'r'+uid(),type:d.type,periodStart:ps,periodEnd:pe,createdAt:now,updatedAt:now,a};S.reviews.push(rev)}
    delete S.drafts[d.type];U.saved[d.type]=rev.id;flush();render();window.scrollTo(0,0);toast('Review saved.');
  },
  async discard(d){if(S.drafts[d.type]?.touched&&!await confirmBox('Clear this draft?','Unsaved answers in this draft will be removed. Saved reviews are not affected.','Clear draft'))return;delete S.drafts[d.type];delete U.saved[d.type];save();render()},
  async editReview(d){const r=S.reviews.find(x=>x.id===d.id),cur=S.drafts[r.type];
    if(cur?.touched&&cur.id!==r.id&&!await confirmBox('Replace the current draft?',`You have an unsaved ${r.type} draft. Opening this review will discard it.`,'Discard draft and open'))return;
    S.drafts[r.type]={type:r.type,id:r.id,date:r.type==='monthly'?r.periodStart.slice(0,7):r.periodStart,a:JSON.parse(JSON.stringify({...newDraft(r.type).a,...r.a}))};delete U.saved[r.type];save();location.hash=r.type;if(U.route===r.type)render()},
  async delReview(d){const r=S.reviews.find(x=>x.id===d.id);if(await confirmBox('Delete review?',`${periodLabel(r)} (${r.type}) will be permanently removed from history.`,'Delete review')){S.reviews=S.reviews.filter(x=>x.id!==d.id);if(S.drafts[r.type]?.id===r.id)delete S.drafts[r.type];save();render()}},
  importActions(){const d=draft('weekly'),prev=byType('weekly').filter(r=>r.periodStart<monday(d.date)).pop();const add=(prev.a.actions||[]).filter(txt).map(t=>({t,status:'',evidence:''}));d.a.commitments=[...d.a.commitments.filter(c=>txt(c.t)),...add];d.touched=true;save();render();toast(add.length+' commitments imported.')},
  newRca(d,el,ev,seed){S.rcas.push({id:'c'+uid(),problem:seed?.problem||'',whys:[0,1,2,3,4].map(i=>({t:i===0&&seed?.why||'',kind:'hypothesis'})),intervention:'',primary:false,status:'open',createdAt:Date.now(),updatedAt:Date.now()});save();if(U.route!=='root-cause')location.hash='root-cause';else render();setTimeout(()=>$('#'+fid(`S.rcas.${S.rcas.length-1}.problem`))?.focus(),50)},
  rcaFrom(d){const o=draft('weekly').a.obstacles[+d.i];if(!txt(o.t)){toast('Describe what stopped you first.','err');return}A.newRca(d,null,null,{problem:o.t,why:o.root})},
  rcaPrimary(d){S.rcas.forEach(r=>r.primary=r.id===d.id?!r.primary:false);save();render()},
  rcaStatus(d){const r=S.rcas.find(x=>x.id===d.id);r.status=r.status==='resolved'?'open':'resolved';r.updatedAt=Date.now();save();render()},
  async delRca(d){if(await confirmBox('Delete analysis?','This root cause analysis will be permanently removed.','Delete analysis')){S.rcas=S.rcas.filter(x=>x.id!==d.id);save();render()}},
  genReport(d){if(d.preset)applyPreset(d.preset);const{start,end}=U.rep;if(!start||!end||start>end){toast('Choose a valid period: the start date must be on or before the end date.','err');if(U.route!=='reports')location.hash='reports';return}
    U.report=buildReport(start,end);if(U.route!=='reports')location.hash='reports';else render();setTimeout(()=>$('#reportBody')?.closest('section').scrollIntoView({block:'start'}),60)},
  reportFor(d){const r=S.reviews.find(x=>x.id===d.id);U.rep={preset:'custom',start:r.periodStart,end:r.periodEnd};A.genReport({})},
  saveReport(){const r=U.report;if(r.saved)return;r.saved=true;S.reports.push(r);flush();render();toast('Report saved.')},
  openReport(d){U.report=S.reports.find(x=>x.id===d.id);U.rep={preset:'custom',start:U.report.periodStart,end:U.report.periodEnd};render();$('#reportBody')?.closest('section').scrollIntoView({block:'start'})},
  async delReport(d){if(await confirmBox('Delete report?','This saved report will be permanently removed. Your reviews are kept.','Delete report')){S.reports=S.reports.filter(x=>x.id!==d.id);if(U.report?.id===d.id)U.report=null;save();render()}},
  copyReport(){copyText(U.report.markdown,'Report copied.')},
  copyAI(d){copyText(aiPayload(U.report),d.open?`Copied. Paste it into ${AI_TARGETS[d.open].name}.`:'Report and analysis prompt copied. Paste into ChatGPT or Claude.')},
  showPrompt(){openDlg(`<div class="stack"><h2>AI analysis prompt</h2><p class="muted small">Placed in front of your report when you copy for AI analysis.</p><textarea rows="14" readonly id="promptView">${esc(AI_PROMPT)}</textarea><div class="row end"><button class="btn" data-dlg="0">Close</button></div></div>`)},
  async dlPdf(d,el){if(!window.jspdf){toast('The PDF library did not load. Check your connection, or use Markdown.','err');return}el.disabled=true;const t=el.textContent;el.textContent='Preparing PDF…';try{await saveFile(fileBase(U.report)+'.pdf',reportPdf(U.report),'application/pdf')}catch(e){toast('Could not create the PDF: '+e.message,'err')}el.disabled=false;el.textContent=t},
  dlMd(){saveFile(fileBase(U.report)+'.md',U.report.markdown,'text/markdown')},
  dlJson(){const r=U.report;saveFile(fileBase(r)+'.json',JSON.stringify({title:r.title,periodStart:r.periodStart,periodEnd:r.periodEnd,generatedAt:new Date(r.createdAt).toISOString(),markdown:r.markdown,data:r.data},null,2),'application/json')},
  exportAll(){saveFile(`personal-board-backup-${today()}.json`,JSON.stringify({app:'personal-board-of-directors',exportedAt:new Date().toISOString(),state:S},null,2),'application/json')},
  async eraseAll(){if(await confirmBox('Erase all data?','Every project, review, report, draft, and analysis in this browser will be deleted. Export a backup first if you might need it.','Erase everything')){S=blankState();R.S=S;U.report=null;U.saved={};try{await Services.storage.clear()}catch(e){}render();toast('All data erased.')}}
};
function setState(next){S={...blankState(),...next,drafts:next.drafts||{}};R.S=S}
async function importFile(file){
  try{const j=JSON.parse(await file.text()),st=j.state||j;
    if(!Array.isArray(st.projects)||!Array.isArray(st.reviews))throw new Error('this file is not a Personal Board of Directors backup');
    if((S.reviews.length||S.projects.length)&&!await confirmBox('Replace current data?',`The backup contains ${st.projects.length} projects and ${st.reviews.length} reviews. It will replace everything currently stored in this browser.`,'Replace with backup'))return;
    setState(st);U.report=null;flush();render();toast('Backup imported.');
  }catch(e){toast('Import failed: '+e.message+'.','err')}
}
function attachFile(file){
  if(file.size>300*1024){toast(`${file.name} is ${Math.round(file.size/1024)} KB. The limit is 300 KB; add a link instead.`,'err');return}
  const fr=new FileReader();fr.onload=()=>{draft('daily').a.evidence.push({label:'',file:{name:file.name,size:file.size,data:fr.result}});save();render()};fr.onerror=()=>toast('Could not read that file.','err');fr.readAsDataURL(file);
}

/* ================= Events ================= */
function onBind(e){
  const el=e.target.closest('[data-bind]');if(!el)return;
  if(el.type==='radio'&&!el.checked)return;
  const p=el.dataset.bind,v=el.type==='checkbox'?el.checked:el.type==='radio'||el.type==='range'?Number(el.value):el.value;
  set(p,v);
  if(p.startsWith('S.')){const m=p.match(/^S\.drafts\.(\w+)\./);if(m)S.drafts[m[1]].touched=true;const c=p.match(/^S\.rcas\.(\d+)\./);if(c)S.rcas[c[1]].updatedAt=Date.now();save()}
  if(p==='U.rep.preset'&&v!=='custom')applyPreset(v);
  if((p==='U.rep.start'||p==='U.rep.end')&&e.type==='input')U.rep.preset='custom';
  if(p==='S.drafts.weekly.date'&&v)S.drafts.weekly.date=monday(v);
  refreshCalcs();
  if(e.type==='change'&&el.dataset.rr)render();
}
document.addEventListener('input',onBind);
document.addEventListener('change',e=>{
  const f=e.target.closest('[data-file]');
  if(f){const file=f.files[0];f.value='';if(file)(f.dataset.file==='import'?importFile:attachFile)(file);return}
  if(e.target.matches('select,input[type=date],input[type=month]'))onBind(e);
});
document.addEventListener('click',e=>{
  const dl=e.target.closest('[data-dlg]');if(dl){e.preventDefault();closeDlg(dl.dataset.dlg==='1');return}
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.tagName!=='A')e.preventDefault();
  Promise.resolve(A[el.dataset.act](el.dataset,el,e)).catch(err=>{console.error(err);toast('Something went wrong: '+err.message,'err')});
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('label.btn')){e.preventDefault();e.target.querySelector('input').click()}});
$('#dlg').addEventListener('close',()=>{if(dlgRes){const r=dlgRes;dlgRes=null;r(false)}});
$('#dlg').addEventListener('submit',e=>e.preventDefault());
window.addEventListener('hashchange',route);
window.addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});

(async function boot(){
  $('#main').innerHTML='<div class="wrap"><p class="muted">Loading your data…</p></div>';
  try{const st=await Services.storage.load();if(st)setState(st);else R.S=S;$('#savestate').textContent='Stored on this device only'}
  catch(e){R.S=S;U.storageOk=false;$('#savestate').className='savestate err';$('#savestate').textContent='Browser storage is unavailable. Entries will not persist; export backups from Data & privacy.'}
  route();
})();
</script>
